[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewbudget"
version = "0.2.0"
description = "Allocate pull request verification effort from structural risk and evidence debt."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Wenhao XU"}]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.scripts]
reviewbudget = "reviewbudget.cli:main"

[project.urls]
Repository = "https://github.com/K-kiron/ReviewBudget"
Issues = "https://github.com/K-kiron/ReviewBudget/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reviewbudget = ["data/*.json", "data/*.toml", "assets/*.css", "assets/*.js"]
