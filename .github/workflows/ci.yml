name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build distribution
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel
        shell: bash
        run: python -m pip install --no-deps dist/*.whl
      - name: Run behavior tests against installed package
        run: python -m unittest discover -s tests -v
      - name: Smoke test CLI and examples
        run: |
          reviewbudget --version
          reviewbudget analyze --input examples/documentation.json --format json
          reviewbudget analyze --input examples/auth-change.json --format markdown
          reviewbudget evaluate --input examples/history.jsonl
          reviewbudget demo --scenario auth --format json --output auth-report.json
          reviewbudget allocate --input auth-report.json --budget-minutes 30
          python scripts/build_preview.py preview
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        with:
          name: public-preview
          path: |
            dist/
            preview/
          if-no-files-found: error
  action:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./
        id: budget
        with:
          policy: examples/budget-policy.toml
          artifact-directory: ${{ runner.temp }}/reviewbudget
      - name: Verify advisory outputs
        shell: bash
        env:
          TIER: ${{ steps.budget.outputs.tier }}
          SKIP_REQUIRED: ${{ steps.budget.outputs.allow-skip-required-checks }}
          SELECTED: ${{ steps.budget.outputs.selected-checks }}
        run: |
          test "$TIER" -ge 0
          test "$TIER" -le 3
          test "$SKIP_REQUIRED" = "false"
          python -c 'import json, os; assert "lint" in json.loads(os.environ["SELECTED"])'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pull-request-verification
          path: ${{ runner.temp }}/reviewbudget/
          if-no-files-found: error
